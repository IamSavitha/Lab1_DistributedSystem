apiVersion: v1
kind: Secret
metadata:
  name: airbnb-secrets
  namespace: airbnb
type: Opaque
stringData:
  # MySQL Database Credentials
  # IMPORTANT: Replace these placeholder values with secure passwords before deployment
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_MYSQL_ROOT_PASSWORD"

  # MongoDB Credentials
  MONGO_PASSWORD: "CHANGE_ME_MONGO_PASSWORD"

  # Session Secret
  # Generate a secure random string for production use
  SESSION_SECRET: "CHANGE_ME_SESSION_SECRET"
